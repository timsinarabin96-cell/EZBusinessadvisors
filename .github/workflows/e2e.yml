name: E2E (manual / on-demand)

# Runs the Playwright E2E suite against a live deployment.
# Requires repo secrets (Settings → Secrets and variables → Actions):
#   BASE_URL                    e.g. https://ezbusinessadvisors.vercel.app
#   NEXT_PUBLIC_SUPABASE_URL    https://<ref>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY   service_role key for that project
# Trigger: Actions tab → "E2E (manual / on-demand)" → Run workflow.
# (Also runs automatically after CI completes on main if secrets exist.)

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    name: Playwright E2E (live site)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # NOTE: the secrets context is NOT valid inside `if` expressions at ANY
    # level (job or step) — GitHub rejects the workflow file ("Unrecognized
    # named-value: 'secrets'"). The guard therefore reads the secret inside a
    # run step (always legal) and gates later steps on its output. If BASE_URL
    # isn't configured, the E2E steps are skipped instead of failing.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check E2E secrets configured
        id: e2e-secrets
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          if [ -n "$BASE_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.e2e-secrets.outputs.enabled == 'true'
        run: npm ci

      - name: Install Playwright chromium
        if: steps.e2e-secrets.outputs.enabled == 'true'
        run: npx playwright install --with-deps chromium

      # Core verified specs only (full-role + journey + lifecycle — the 7/7
      # from the deep-pass audit, same set as package.json "test:full"). The
      # FULL e2e folder (20+ specs with CI retries) exceeds a 30-min job
      # timeout against the live site — run 33599543883 was cancelled at the
      # ceiling before the cross-browser smoke could execute.
      - name: Run E2E suite (core specs)
        if: steps.e2e-secrets.outputs.enabled == 'true'
        run: npx playwright test e2e/full-role.spec.ts e2e/journey.spec.ts e2e/lifecycle.spec.ts
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Deep-pass fix: cross-browser smoke (Firefox + WebKit) on key public
      # pages — the local VPS can't install WebKit system deps, so CI covers it.
      - name: Install Firefox + WebKit
        if: steps.e2e-secrets.outputs.enabled == 'true'
        run: npx playwright install --with-deps firefox webkit

      - name: Cross-browser smoke (Firefox + WebKit + Chromium)
        if: steps.e2e-secrets.outputs.enabled == 'true'
        run: node --import ./scripts/paths-loader.mjs --experimental-strip-types scripts/cross-browser-smoke.mts
        env:
          BASE_URL: ${{ secrets.BASE_URL }}

      - name: Upload trace artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
